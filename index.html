<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="LearnOffline - Offline-First Learning App for Rural Areas. Learn anywhere, even without internet.">
  <meta name="theme-color" content="#176B5B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>LearnOffline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
</head>
<body>
  <div id="app">
    <header class="top-bar" id="top-bar">
      <a href="#" class="brand" onclick="event.preventDefault(); navigateTo('dashboard');">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <span class="brand-text">LearnOffline</span>
      </a>
      <div class="top-bar-actions" id="top-bar-actions">
        <div class="connection-pill online" id="connection-pill" aria-live="polite">
          <span class="connection-dot"></span>
          <span class="connection-text">Online</span>
        </div>
      </div>
    </header>

    <main id="main-content"></main>

    <nav class="bottom-nav" id="bottom-nav">
      <a href="#" class="nav-item active" data-view="dashboard" onclick="event.preventDefault(); navigateTo('dashboard');">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item" data-view="courses" onclick="event.preventDefault(); navigateTo('courses');">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <span>Learn</span>
      </a>
      <a href="#" class="nav-item" data-view="downloads" onclick="event.preventDefault(); navigateTo('downloads');">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Downloads</span>
      </a>
      <a href="#" class="nav-item" data-view="profile" onclick="event.preventDefault(); navigateTo('profile');">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script src="js/db.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/courses.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/assignments.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/download.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>

  <script>
    (async function initApp() {
      try {
        await initDB();
        initOffline();
        
        const profile = await getCurrentStudent();
        const profileData = document.createElement('div');
        profileData.id = 'profile-data';
        profileData.dataset.hasProfile = profile ? 'true' : 'false';
        document.body.appendChild(profileData);
        
        navigateTo('dashboard');
        
        if ('serviceWorker' in navigator) {
          try {
            await navigator.serviceWorker.register('/sw.js');
          } catch (err) {
            console.error('Service Worker registration failed:', err);
          }
        }
      } catch (err) {
        console.error('App initialization failed:', err);
        showToast('Failed to initialize app. Please refresh.', 'error');
      }
    })();
  </script>
</body>
</html>
